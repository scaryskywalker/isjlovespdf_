<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISJlovesPDF</title>
    <link rel="stylesheet" href="assets.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="font-awesome-4.7.0/css/font-awesome.min.css" />
  </head>
  <body>
    <!-- main buttons -->
    <div class="loadingApi">
      <div class="loader"></div>
      <p>Waking up the server... This might take up to 30 seconds.</p>
    </div>

    <div class="main-containers">
      <button id="merge-btn">Merge PDF</button>
      <button>Split PDF</button>
    </div>

    <!-- Merge dialog box -->

    <dialog id="mergeDialogbox">
      <form action="" id="mergeform" onsubmit="return false;">
        <div
          style="padding: 30px; border: 2px dashed red"
          id="upload-section-merge"
        >
          <input type="file" id="merge-files" accept=".pdf" multiple hidden />
          <button type="Upload" id="uploadfilesmerge">Upload</button>
        </div>
      </form>
      <div class="total_files"></div>
      <div style="display: flex; justify-content: center; align-items: center">
        <button id="merge-submit">Submit</button>
      </div>
    </dialog>

    <!-- end -->

    <script src="functions/merge.js"></script>

    <script>
      const mainContainer = document.querySelector(".main-containers");
      const loading = document.querySelector(".loadingApi");

      async function callapi(health, retryInterval = 3000, maxtries = 20) {
        let attempts = 0;

        while (attempts < maxtries) {
          try {
            attempts++;
            loading.style.display = "flex";
            const data = await fetch(health, { method: "GET" });

            if (data.ok) {
              return true;
            }
          } catch (error) {
            console.log("Backend not ready");
          }

          await new Promise((resolve) => setTimeout(resolve, retryInterval));
        }
      }

      document.addEventListener("DOMContentLoaded", async () => {
        try {
          await callapi("http://127.0.0.1:8000/", 3000, 20);

          loading.style.display = "none";
          mainContainer.style.display = "flex";
        } catch (error) {
          loading.innerHTML = `<p>Server Connection timeout</p>`;
        }
      });
    </script>
  </body>
</html>
