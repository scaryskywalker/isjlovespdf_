<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISJlovesPDF</title>
    <link rel="stylesheet" href="assets.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-containers">
      <button id="merge-btn">Merge PDF</button>
      <button>Split PDF</button>
    </div>

    <!-- Merge dialog box -->

    <dialog id="mergeDialogbox">
      <div
        style="padding: 30px; border: 1px dashed red"
        id="upload-section-merge"
      >
        <input type="file" id="merge-files" multiple hidden />
        <button id="uploadfilesmerge">Upload</button>
      </div>
      <div style="display: flex; justify-content: center; align-items: center">
        <button id="merge-submit">Submit</button>
      </div>
    </dialog>

    <!-- end -->

    <script src="functions/merge.js"></script>
  </body>
</html>
